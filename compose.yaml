# Local development stack. Works with no .env files: every value below has a
# development default, and the backend fills in the rest from APP_ENV=development.
# Optional overrides:
#   - root .env      -> POSTGRES_* and APP_ENV (used for ${...} interpolation below)
#   - backend/.env   -> any other backend setting (see backend/.env.example)
x-postgres: &postgres
  POSTGRES_USER: ${POSTGRES_USER:-projectv}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
  POSTGRES_DB: ${POSTGRES_DB:-public_transport}

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
  backend:
    build: ./backend
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Built from the same POSTGRES_* values as the database service, so they can't drift.
      DATABASE_URL: postgres://${POSTGRES_USER:-projectv}:${POSTGRES_PASSWORD:-local_dev_password}@database:5432/${POSTGRES_DB:-public_transport}?sslmode=disable

  database:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    environment: *postgres

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
