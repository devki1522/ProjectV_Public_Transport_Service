name: Code quality and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: npm ci
      - run: npm ci --prefix frontend
      - name: Run lint, formatting, and vet
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Run all unit tests
        working-directory: backend
        run: go test -count=1 ./...

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Test development authentication setup
        run: node --test scripts/setup-auth.test.mjs
      - name: Run frontend behavior tests
        run: npm test --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  backend-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: npm ci
      - name: Build and verify static pkgsite documentation
        run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-pkgsite-documentation
          path: docs/backend/backend-documentation.zip
          if-no-files-found: error

  swagger-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Generate Swagger specification
        run: npm run docs:api
      - name: Check committed specification is current
        run: |
          git diff --exit-code -- backend/docs
          test -z "$(git ls-files --others --exclude-standard backend/docs)"
