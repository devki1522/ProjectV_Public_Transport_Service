name: Build and Push Containers to ACR

on:
  push:
    branches:
      - main
      - azure-appservice-deploy
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: acrtransportprojectv.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stage GRT seed SQL for backend image
        run: |
          mkdir -p backend/seeds
          cp database/seeds/grt.sql backend/seeds/grt.sql

      - name: Build and push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: acrtransportprojectv.azurecr.io/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: acrtransportprojectv.azurecr.io/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Azure App Service pull and restart
        if: github.ref == 'refs/heads/main' && env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.AZURE_WEBAPP_CD_WEBHOOK_URL }}
        run: curl -fsSL -X POST "$WEBHOOK_URL"
