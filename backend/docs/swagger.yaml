info:
  contact: {}
  description: 'Public resident schedules, cookie-authenticated transit administration,
    and Bearer JWT service-to-service integrations (SH-S07). Admin browser mutations
    require an administrator session, a trusted Origin, and X-CSRF-Token from login
    or /auth/me; /integrations/* endpoints also accept Authorization: Bearer <token>
    from Registration Service without cookies or CSRF.'
  title: Public Transport Service API
  version: "1.0"
paths:
  /api/transport/v1/admin/budget:
    get:
      description: Requires an administrator session cookie. Queries Budget & Finance
        GET /api/budget/v1/allocations/TRANSIT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/budget.Allocation'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get transit operating budget allocation
      tags:
      - budget
  /api/transport/v1/admin/budget/expenses:
    post:
