basePath: /
definitions:
  auth.LoginRequest:
    properties:
      password:
        type: string
      rememberMe:
        type: boolean
      username:
        type: string
    type: object
  auth.Principal:
    properties:
      id:
        type: string
      roles:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  auth.SessionResponse:
    properties:
      csrfToken:
        type: string
      expiresAtUtc:
        type: string
      isAdmin:
        type: boolean
      user:
        $ref: '#/definitions/auth.Principal'
    type: object
  handlers.SimulatorStartInput:
    properties:
      speed_multiplier:
        type: number
    type: object
  handlers.TransitRouteResponse:
    properties:
      direction:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      number:
        type: string
      route_type:
        type: integer
      source_id:
        type: string
    type: object
  services.CreateTransitRouteInput:
    properties:
      direction:
        type: string
      name:
        type: string
      number:
        type: string
    type: object
  services.DashboardSummary:
    properties:
      active_routes:
        type: integer
      inactive_routes:
        type: integer
      total_routes:
        type: integer
    type: object
  services.UpdateTransitRouteInput:
    properties:
      direction:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      number:
        type: string
    type: object
  transit.Departure:
    properties:
      estimated_departure_time:
        type: string
      route:
        $ref: '#/definitions/transit.Route'
      route_stop_id:
        type: integer
      scheduled_departure_time:
        type: string
      service_date:
        type: string
      stop_id:
        type: integer
      stop_name:
        type: string
      stop_sequence:
        type: integer
      trip_id:
        type: integer
    type: object
  transit.DisruptionNotice:
    properties:
      end_time:
        type: string
      id:
        type: integer
      start_time:
        type: string
      status:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  transit.Itinerary:
    properties:
      destination_stop:
        $ref: '#/definitions/transit.Stop'
      duration_minutes:
        type: integer
      estimated_arrival_time:
        type: string
      estimated_departure_time:
        type: string
      legs:
        items:
          $ref: '#/definitions/transit.JourneyLeg'
        type: array
      origin_stop:
        $ref: '#/definitions/transit.Stop'
      scheduled_arrival_time:
        type: string
      scheduled_departure_time:
        type: string
      transfers:
        type: integer
      walking_minutes:
        type: integer
    type: object
  transit.JourneyLeg:
    properties:
      distance_meters:
        type: integer
      duration_minutes:
        type: integer
      estimated_arrival_time:
        type: string
      estimated_departure_time:
        type: string
      from_stop_id:
        type: integer
      from_stop_name:
        type: string
      from_stop_sequence:
        type: integer
      mode:
        type: string
      route:
        $ref: '#/definitions/transit.Route'
      scheduled_arrival_time:
        type: string
      scheduled_departure_time:
        type: string
      service_date:
        type: string
      stop_count:
        type: integer
      stops:
        items:
          $ref: '#/definitions/transit.StopTime'
        type: array
      to_stop_id:
        type: integer
      to_stop_name:
        type: string
      to_stop_sequence:
        type: integer
      trip_id:
        type: integer
    type: object
  transit.JourneySearchResult:
    properties:
      destination:
        type: string
      destination_stops:
        items:
          $ref: '#/definitions/transit.Stop'
        type: array
      excluded_disruptions:
        items:
          $ref: '#/definitions/transit.DisruptionNotice'
        type: array
      from:
        type: string
      itineraries:
        items:
          $ref: '#/definitions/transit.Itinerary'
        type: array
      message:
        type: string
      origin:
        type: string
      origin_stops:
        items:
          $ref: '#/definitions/transit.Stop'
        type: array
      timezone:
        type: string
      until:
        type: string
    type: object
  transit.Route:
    properties:
      direction:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      number:
        type: string
    type: object
  transit.ScheduledTrip:
    properties:
      id:
        type: integer
      schedule_type:
        type: string
      status:
        type: string
      stop_times:
        items:
          $ref: '#/definitions/transit.StopTime'
        type: array
    type: object
  transit.Stop:
    properties:
      id:
        type: integer
      is_active:
        type: boolean
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      wheelchair_boarding:
        type: integer
    type: object
  transit.StopDetails:
    properties:
      departures:
        items:
          $ref: '#/definitions/transit.Departure'
        type: array
      stop:
        $ref: '#/definitions/transit.Stop'
    type: object
  transit.StopTime:
    properties:
      route_stop_id:
        type: integer
      scheduled_arrival_time:
        type: string
      scheduled_departure_time:
        type: string
      stop_id:
        type: integer
      stop_name:
        type: string
      stop_sequence:
        type: integer
    type: object
  transit.Timetable:
    properties:
      route:
        $ref: '#/definitions/transit.Route'
      service_date:
        type: string
      timezone:
        type: string
      trips:
        items:
          $ref: '#/definitions/transit.ScheduledTrip'
        type: array
    type: object
  vehicles.ActiveVehicle:
    properties:
      direction:
        type: string
      heading:
        type: number
      is_accessible:
        type: boolean
      is_simulated:
        type: boolean
      latitude:
        type: number
      longitude:
        type: number
      received_at:
        type: string
      recorded_at:
        type: string
      route_id:
        type: integer
      route_name:
        type: string
      route_number:
        type: string
      source_service:
        type: string
      speed_kmh:
        type: number
      status:
        type: string
      trip_id:
        type: integer
      vehicle_id:
        type: integer
      vehicle_number:
        type: string
    type: object
  vehicles.Coordinate:
    properties:
      lat:
        type: number
      lng:
        type: number
    type: object
  vehicles.EstimatedArrival:
    properties:
      delay_minutes:
        type: integer
      direction:
        type: string
      distance_meters:
        type: integer
      estimated_arrival_time:
        type: string
      is_simulated:
        type: boolean
      recorded_at:
        type: string
      route_id:
        type: integer
      route_name:
        type: string
      route_number:
        type: string
      scheduled_arrival_time:
        type: string
      stop_id:
        type: integer
      stop_name:
        type: string
      stop_sequence:
        type: integer
      trip_id:
        type: integer
      vehicle_id:
        type: integer
      vehicle_number:
        type: string
      vehicle_status:
        type: string
    type: object
  vehicles.LocationUpdateInput:
    properties:
      heading:
        type: number
      is_accessible:
        type: boolean
      is_simulated:
        type: boolean
      latitude:
        type: number
      longitude:
        type: number
      recorded_at:
        type: string
      route_id:
        type: integer
      source_service:
        type: string
      speed_kmh:
        type: number
      status:
        type: string
      trip_id:
        type: integer
      vehicle_id:
        type: integer
      vehicle_number:
        type: string
    type: object
  vehicles.RouteGeometry:
    properties:
      coordinates:
        items:
          $ref: '#/definitions/vehicles.Coordinate'
        type: array
      direction:
        type: string
      headsign:
        type: string
      route_id:
        type: integer
      route_name:
        type: string
      route_number:
        type: string
    type: object
  vehicles.SimulatorStatus:
    properties:
      last_tick_at:
        type: string
      route_count:
        type: integer
      running:
        type: boolean
      speed_multiplier:
        type: number
      tick_interval_ms:
        type: integer
      total_updates_sent:
        type: integer
      vehicle_count:
        type: integer
    type: object
info:
  contact: {}
  description: Public resident schedules and cookie-authenticated transit administration.
    Mutations require an administrator session, a trusted Origin, and X-CSRF-Token
    from login or /auth/me.
  title: Public Transport Service API
  version: "1.0"
paths:
  /api/admin/dashboard:
    get:
      description: Requires a valid administrator session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.DashboardSummary'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Administrator dashboard
      tags:
      - administration
  /api/admin/health:
    get:
      description: Requires a valid administrator session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Administrator health
      tags:
      - administration
  /api/admin/vehicles/simulator/reset:
    post:
      parameters:
      - description: Session-bound CSRF token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vehicles.SimulatorStatus'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset simulated vehicle locations
      tags:
      - vehicles
  /api/admin/vehicles/simulator/start:
    post:
      consumes:
      - application/json
      parameters:
      - description: Session-bound CSRF token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Optional simulator speed multiplier
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.SimulatorStartInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vehicles.SimulatorStatus'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start live bus simulator
      tags:
      - vehicles
  /api/admin/vehicles/simulator/step:
    post:
      parameters:
      - description: Session-bound CSRF token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vehicles.SimulatorStatus'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Advance simulated buses by one step
      tags:
      - vehicles
  /api/admin/vehicles/simulator/stop:
    post:
      parameters:
      - description: Session-bound CSRF token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vehicles.SimulatorStatus'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Pause live bus simulator
      tags:
      - vehicles
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Requires a trusted Origin. Returns a CSRF token and backend-derived
        isAdmin capability; never returns the JWT.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign in and establish an opaque cookie session
      tags:
      - authentication
  /api/auth/logout:
    post:
      description: Requires a trusted Origin. Expired or missing sessions are cleared
        idempotently.
      parameters:
      - description: Required for an active session
        in: header
        name: X-CSRF-Token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Invalidate the local session and clear its cookie
      tags:
      - authentication
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Restore the authenticated session
      tags:
      - authentication
  /api/departures:
    get:
      responses: {}
  /api/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check API health
      tags:
      - health
  /api/journeys:
    get:
      description: Accepts origin (origin_stop_id and/or origin) and destination (destination_stop_id
        and/or destination). Returns direct, multi-transfer (up to 3 transfers), and
        walking-connected itinerary options with ordered leg stops, optional live
        estimates, and exclusion of cancelled trips, closed stops, and disrupted route
        segments, or a meaningful message when no itinerary is found.
      parameters:
      - description: Positive origin stop ID
        in: query
        minimum: 1
        name: origin_stop_id
        type: integer
      - description: Positive destination stop ID
        in: query
        minimum: 1
        name: destination_stop_id
        type: integer
      - description: Origin stop or location name
        in: query
        name: origin
        type: string
      - description: Destination stop or location name
        in: query
        name: destination
        type: string
      - description: RFC3339 timestamp; defaults to now
        in: query
        name: from
        type: string
      - description: RFC3339 timestamp; defaults to from plus 6 hours
        in: query
        name: until
        type: string
      - default: 5
        description: Maximum itineraries
        in: query
        maximum: 20
        minimum: 1
        name: limit
        type: integer
      - default: 3
        description: Maximum transit transfers
        in: query
        maximum: 3
        minimum: 0
        name: max_transfers
        type: integer
      - default: 600
        description: Maximum straight-line walking distance per walk leg in meters
          (0 disables walking)
        in: query
        maximum: 1500
        minimum: 0
        name: max_walk_meters
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transit.JourneySearchResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search transit journeys between two locations
      tags:
      - schedules
  /api/routes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.TransitRouteResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all routes, including inactive routes
      tags:
      - routes
    post:
      consumes:
      - application/json
      description: Requires an administrator session cookie, trusted Origin, and the
        CSRF token from login or /auth/me.
      parameters:
      - description: Session-bound CSRF token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Route fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/services.CreateTransitRouteInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.TransitRouteResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a route
      tags:
      - routes
  /api/routes/{id}:
    delete:
      description: Requires an administrator session cookie, trusted Origin, and the
        CSRF token from login or /auth/me.
      parameters:
      - description: Session-bound CSRF token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Positive route ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Route deactivated
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Deactivate a route while preserving related records
      tags:
      - routes
    get:
      parameters:
      - description: Positive route ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TransitRouteResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a route
      tags:
      - routes
    patch:
      consumes:
      - application/json
      description: Requires an administrator session cookie, trusted Origin, and the
        CSRF token from login or /auth/me.
      parameters:
      - description: Session-bound CSRF token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Positive route ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Route fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/services.UpdateTransitRouteInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TransitRouteResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update route fields
      tags:
      - routes
  /api/routes/{id}/schedule:
    get:
      parameters:
      - description: Positive route ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Agency-local service date (YYYY-MM-DD)
        example: "2026-11-10"
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transit.Timetable'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a route timetable
      tags:
      - schedules
  /api/routes/{id}/shape:
