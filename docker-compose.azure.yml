# Azure App Service (multi-container) deployment.
#
# This file holds only NON-SECRET settings. App Service injects every
# Configuration > Application setting into all containers as environment
# variables, so secrets live there instead (see AZURE_DEPLOYMENT.md):
#   DATABASE_URL, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
# Do not add those keys here: App Service does not support ${VAR} substitution
# in compose files, and a value here could shadow the app setting.

services:
  frontend:
    image: acrtransportprojectv.azurecr.io/frontend:latest
    ports:
      - "3000:3000"
    environment:
      - API_PROXY_TARGET=http://backend:8080
    depends_on:
      - backend
    restart: always

  backend:
    image: acrtransportprojectv.azurecr.io/backend:latest
    expose:
      - "8080"
    environment:
      # production enforces secure cookies, HTTPS origins and Registration login,
      # and rejects the development-only mock login.
      - APP_ENV=production
      - AUTH_PROVIDER=registration
      - AUTH_TRUSTED_ORIGINS=https://rg-public-transport.azurewebsites.net
      # App Service terminates TLS in front of the containers.
      - AUTH_TRUSTED_PROXY=true
      - REGISTRATION_SERVICE_URL=https://cm-rs-api-gbgrffa8h5e5fdcy.canadaeast-01.azurewebsites.net
      - REGISTRATION_JWT_ISSUER=CmRegistrationService
      - REGISTRATION_JWT_AUDIENCE=CmRegistrationClients
      - SIMULATE_VEHICLES=true
      - STAFF_HR_SERVICE_URL=https://cmes-staffhr-api-gtofz7g3n2z56.azurewebsites.net
      - BUDGET_SERVICE_URL=https://financeapi20261125000202-g9ctbdc4axdscbet.westus-01.azurewebsites.net
    depends_on:
      - database
    restart: always

  database:
    image: postgres:18
    expose:
      - "5432"
    restart: always
