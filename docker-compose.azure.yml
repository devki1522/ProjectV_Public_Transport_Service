version: '3.8'

services:
  frontend:
    image: acrtransportprojectv.azurecr.io/frontend:latest
    ports:
      - "3000:3000"
    environment:
      - API_PROXY_TARGET=http://backend:8080
    depends_on:
      - backend
    restart: always

  backend:
    image: acrtransportprojectv.azurecr.io/backend:latest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - API_VERSION=v1
      - DATABASE_URL=postgres://projectv:local_dev_password@database:5432/public_transport?sslmode=disable
      - DB_MAX_IDLE_CONNS=5
      - DB_MAX_OPEN_CONNS=20
      - DB_CONN_MAX_LIFETIME=1h
      - APP_ENV=development
      - AUTH_PROVIDER=mock
      - AUTH_REQUIRED_ROLE=TransitAdministrator
      - AUTH_SESSION_COOKIE=transit_session
      - AUTH_COOKIE_SECURE=false
      - AUTH_TRUSTED_ORIGINS=http://localhost:3000,https://app-public-transport-grt.azurewebsites.net,http://app-public-transport-grt.azurewebsites.net
      - AUTH_TRUSTED_PROXY=true
      - MOCK_JWT_ISSUER=transit-dev
      - MOCK_JWT_AUDIENCE=transit-api
      - MOCK_JWT_SECRET=c29tZXJhbmRvbXNlY3JldGtleWZvcmF6dXJlZGVwbG95bWVudDEyMzQ1Ng
      - MOCK_ADMIN_PASSWORD=AdminPassword2026!
      - SIMULATE_VEHICLES=true
      - SIMULATE_VEHICLES_COUNT=10
      - SIMULATE_TICK_INTERVAL=3s
    depends_on:
      - database
    restart: always

  database:
    image: postgres:18
    environment:
      - POSTGRES_USER=projectv
      - POSTGRES_PASSWORD=local_dev_password
      - POSTGRES_DB=public_transport
    ports:
      - "5432:5432"
    restart: always
